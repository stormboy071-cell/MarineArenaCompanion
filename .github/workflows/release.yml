name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify release tag matches app version
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'src'); from marine_arena_companion import __version__; print(__version__)"
          $tagVersion = "${env:GITHUB_REF_NAME}".TrimStart("v")
          if ($version -ne $tagVersion) {
            throw "Release tag $tagVersion does not match app version $version."
          }
      - name: Build Windows bundle
        env:
          MARINE_ARENA_UPDATE_REPOSITORY: ${{ github.repository }}
        shell: cmd
        run: scripts\build_windows.bat
      - name: Package app and checksum
        shell: pwsh
        run: |
          $bundle = "dist\MarineArenaCompanion"
          $archive = "dist\MarineArenaCompanion-windows-x64.zip"
          Compress-Archive -Path "$bundle\*" -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$archive.sha256" -Value "$hash  MarineArenaCompanion-windows-x64.zip" -NoNewline -Encoding ascii
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}"
          gh release create $version `
            "dist\MarineArenaCompanion-windows-x64.zip" `
            "dist\MarineArenaCompanion-windows-x64.zip.sha256" `
            --title "Marine Arena Companion $version" `
            --generate-notes
